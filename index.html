<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet</title>
<script>try{var t=localStorage.getItem("hrms_theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#192038;--mute:#667094;--line:#e1e5f2;--acc:#3a55d6;--acc2:#e8ecff;--accink:#fff;--ok:#16895d;--okbg:#e2f6ed;--warn:#d1433a;--sh:0 1px 2px rgba(25,32,56,.06),0 10px 28px rgba(25,32,56,.07);--shb:0 1px 2px rgba(25,32,56,.18);--shin:none;--inbg:var(--bg);--head:var(--bg);--r:16px;--ri:10px;--bw:0px;--font:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--bg:#0f1425;--card:#181f36;--ink:#e8ecfb;--mute:#94a0c8;--line:#29324f;--acc:#8a9eff;--acc2:#232c54;--accink:#0f1425;--ok:#4fd6a1;--okbg:#15332a;--warn:#ff8a80;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);--shb:0 1px 2px rgba(0,0,0,.5)}
:root[data-theme="soft"]{--bg:#e0e5ec;--card:#e0e5ec;--ink:#3b4357;--mute:#6d7790;--line:#cfd6e2;--acc:#4a63d8;--acc2:#d3daea;--accink:#fff;--ok:#1f8f66;--okbg:#d3e8e0;--warn:#c9463d;--sh:9px 9px 18px #a3b1c6,-9px -9px 18px #fff;--shb:5px 5px 10px #a3b1c6,-5px -5px 10px #fff;--shin:inset 3px 3px 6px #a3b1c6,inset -3px -3px 6px #fff;--inbg:#e0e5ec;--head:#d6dce6;--r:22px;--ri:14px}
:root[data-theme="bw"]{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#000;--acc:#000;--acc2:#eee;--accink:#fff;--ok:#fff;--okbg:#000;--warn:#000;--sh:none;--shb:none;--head:#eee;--r:4px;--ri:3px;--bw:2px}
:root[data-theme="paper"]{--bg:#ece3cf;--card:#fbf6e9;--ink:#2d2a24;--mute:#6e6552;--line:#d6c9a8;--acc:#2f5d62;--acc2:#e5ddc4;--accink:#fbf6e9;--ok:#3b6b3b;--okbg:#e1ead3;--warn:#a8412f;--sh:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(90,70,20,.14);--shb:0 1px 0 rgba(0,0,0,.2);--head:#efe6cf;--r:6px;--ri:4px;--bw:1px;--font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--acc);position:relative}
.brand i::after{content:"";position:absolute;left:12px;top:6px;width:3px;height:9px;border-radius:2px;background:var(--accink);box-shadow:4px 7px 0 -0.5px var(--accink)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:var(--r);background:var(--bg);box-shadow:var(--shin);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shb)}
.sync{margin-left:auto;font-size:12px;color:var(--mute)}
main{max-width:none;margin:0;padding:24px 28px}
.tab{display:none}.tab.on{display:block}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:var(--bw) solid var(--line);padding:24px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{font-size:19px;margin:0}
h3{font-size:14px;margin:0 0 10px}
.grp{margin-top:22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
input,select,textarea{font:inherit;font-weight:500;color:var(--ink);padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--ri);background:var(--inbg);box-shadow:var(--shin);min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.auto{background:var(--acc2);border-color:transparent;color:var(--acc);font-weight:700}
.dur{font-size:18px}
.btn{border:0;background:var(--acc);color:var(--accink);padding:10px 20px;border-radius:var(--ri);box-shadow:var(--shb);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.del{background:none;color:var(--warn);box-shadow:none}
.btn.warnb{background:var(--warn);color:var(--accink)}
.btn.sm{padding:4px 11px;font-size:13px}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.side{position:sticky;top:84px;display:grid;gap:20px;min-width:0}
.sel{display:grid;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;color:var(--acc);line-height:1.1;margin-top:10px}
.today ul{list-style:none;padding:0;margin:14px 0 0}
.today li{display:block;padding:11px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.today li:hover b.t{color:var(--acc)}
.tl{display:flex;justify-content:space-between;gap:8px}
.sub{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.rm{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
#t_list{max-height:calc(100vh - 560px);min-height:140px;overflow:auto}
.stack{display:grid;gap:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tp{display:inline-flex;border-radius:99px;background:var(--acc2);overflow:hidden}
.tp button{border:0;background:none;color:var(--acc);font:inherit;font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer}
.tp button:hover{background:var(--acc);color:var(--accink)}
.tp button+button{padding:6px 9px}
.muted{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.bar input{width:auto}
.grow{flex:1}
.scroll{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;background:var(--head)}
.chip{padding:2px 10px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600;font-size:12px}
.chip.ok{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:600;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.themesel{width:auto;padding:6px 10px;font-size:13px}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:root[data-theme="bw"] .btn{border:2px solid #000}
:root[data-theme="bw"] .btn.ghost,:root[data-theme="bw"] .btn.del{background:#fff;color:#000}
:root[data-theme="bw"] .seg button.on{background:#000;color:#fff}
:root[data-theme="bw"] .chip{border:1px solid #000}
:root[data-theme="bw"] .top{border-bottom:2px solid #000}
:root[data-theme="paper"] body{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 30px}
@media(max-width:860px){.side{position:static}#t_list{max-height:none}}
@media(max-width:700px){
 .top{position:static;padding:10px 14px;gap:10px}
 .top nav{width:100%}.seg{width:100%}.seg button{flex:1;padding:9px 6px}
 .tools{margin-left:0;width:100%;justify-content:space-between}
 main{padding:14px}.card{padding:16px}
 .g{grid-template-columns:repeat(2,minmax(0,1fr))}
 input,select,textarea{font-size:16px}
 .btn{min-height:44px}.btn.sm{min-height:36px}
 .bar>*{flex:1 1 140px}.grow{display:none}
 .row .btn{flex:1}
 .toast{width:calc(100% - 32px);text-align:center}
 #r_tbl,#r_tbl tbody,#r_tbl tr,#r_tbl td{display:block}
 #r_tbl tr.hd{display:none}
 #r_tbl tr{border:1px solid var(--line);border-radius:var(--ri);padding:8px 12px;margin-bottom:10px;background:var(--bg)}
 #r_tbl td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;white-space:normal;text-align:right}
 #r_tbl td::before{content:attr(data-label);color:var(--mute);font-weight:600;text-align:left;flex:0 0 42%}
 #r_tbl td:empty{display:none}
 #r_tbl td:last-child{justify-content:flex-end;gap:8px;padding-top:8px}
 #r_tbl td:last-child::before{content:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>Timesheet</div>
  <nav class="seg" id="nav">
    <button data-t="entry" class="on">New entry</button><button data-t="rec">Records</button><button data-t="mas">Masters</button>
  </nav>
  <div class="tools"><select id="themeSel" class="themesel" aria-label="Theme"></select><button class="btn sm ghost" id="syncBtn">Sync now</button><a class="btn sm ghost" id="sheetLink" href="#" target="_blank" rel="noopener" style="text-decoration:none">Open Google Sheet</a><span class="sync" id="sync"></span></div>
</header>
<main>

<section class="tab on" id="entry"><div class="cols">
    <div class="card">
    <div class="head"><h2 id="formTitle">New entry</h2><span class="muted">Only the date is required</span></div>
    <div class="grp"><h3>When</h3><div class="g">
      <label>Date<input type="date" id="f_date"></label>
      <label>Start time<input type="time" id="f_s"></label>
      <label>End time<input type="time" id="f_e"></label>
      <label>Total duration<input id="f_dur" class="auto dur" readonly placeholder="--:--"></label>
    </div></div>
    <div class="grp"><h3>Customer</h3><div class="g">
      <label>Business name<select id="f_biz"></select></label>
      <label>Code<input id="f_code" class="auto" readonly placeholder="Fills from business"></label>
      <label>Contact no<input id="f_contact" inputmode="tel"></label>
    </div></div>
    <div class="grp"><h3>Details</h3><div class="g">
      <label>Source<select id="f_src"></select></label>
      <label>Product<select id="f_prod"></select></label>
      <label>Issue / request<select id="f_issue"><option value=""></option><option>Issue</option><option>Request</option></select></label>
      <label>Ticket no<input id="f_ticket"></label>
      <label>Status<select id="f_stat"></select></label>
    </div>
    <label style="margin-top:14px">Remarks<textarea id="f_rem" rows="2"></textarea></label></div>
    <div class="row"><button class="btn" id="saveBtn">Save entry</button><button class="btn ghost" id="clearBtn">Clear</button></div>
  </div>
  <div class="side">
  <div class="card">
    <div class="head" style="margin:0"><h2 style="font-size:17px">Quick templates</h2><button class="btn sm ghost" id="tplToggle" aria-expanded="true">Hide</button></div>
    <div id="tplBody">
    <div class="sel">
      <select id="tplSel"></select>
      <div class="row" style="margin:0"><button class="btn" id="tplApply">Apply to form</button><button class="btn del" id="tplDel">Delete</button></div>
      <button class="btn ghost" id="tplNew">Save current form as template</button>
      <div id="tplForm" style="display:none" class="sel">
        <label>Template name<input id="tpl_name"></label>
        <button class="btn sm" id="tplSave">Save template</button>
      </div>
    </div>
    <p class="muted" style="margin:10px 0 0;font-size:12px">Templates keep business, source, product, Issue/Request, status, contact and remarks. Date and times are always yours to set.</p></div>
  </div>
  <aside class="card today">
    <div class="head" style="align-items:flex-start"><h2>Today</h2><div style="text-align:right"><div id="clk_d" class="muted" style="font-size:13px"></div><b id="clk_t" style="font-size:20px;font-variant-numeric:tabular-nums"></b></div></div>
    <div class="big" id="t_dur">00:00</div>
    <div class="muted"><span id="t_n">0</span> entries logged</div>
    <ul id="t_list"></ul>
  </aside>
  </div>
</div></section>

<section class="tab" id="rec"><div class="card">
  <div class="bar">
    <div class="seg" id="r_seg"><button data-m="day" class="on">Day</button><button data-m="month">Month</button></div>
    <input type="date" id="r_day"><input type="month" id="r_month" style="display:none">
    <span class="grow"></span><b id="r_tot"></b>
    <button class="btn ghost" id="recSheet">Open Google Sheet</button><button class="btn" id="expBtn">Export to Excel</button>
  </div>
  <div class="scroll"><table id="r_tbl"></table></div>
</div></section>

<section class="tab" id="mas"><div class="card">
  <div class="seg" id="m_seg">
    <button data-k="biz" class="on">Business names</button><button data-k="prod">Products</button><button data-k="stat">Status</button><button data-k="src">Source</button>
  </div>
  <div class="bar" style="margin-top:20px">
    <label>Name<input id="m_name"></label>
    <label id="m_codew">Code (blank = auto)<input id="m_code" style="width:140px"></label>
    <button class="btn" id="m_add">Add</button><button class="btn ghost" id="m_cancel" style="display:none">Cancel</button>
    <span class="grow"></span>
    <button class="btn ghost" id="m_up">Upload CSV / Excel</button><button class="btn ghost" id="m_tpl">Download template</button>
    <input type="file" id="m_file" accept=".csv,.xlsx,.xls" hidden>
  </div>
  <p class="muted" id="m_hint" style="margin:10px 0 0"></p>
  <h3 id="m_h" style="margin-top:22px"></h3>
  <div class="scroll" style="margin-top:0"><table id="m_tbl"></table></div>
</div></section>

</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>$$(s)[0],$$=s=>document.querySelectorAll(s),K="hrms_timesheet_v2";
const API="https://script.google.com/macros/s/AKfycbxCWxQX9YnTTBCEVLOmAKuY5l07F1zectqndWLmRrHPGk3yoYdXXM8uCTOPe7uqy6Yv/exec"; // Google Apps Script Web app URL (keep the same deployment so this never changes)
let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=Object.assign({tpl:[],prod:[],biz:[],stat:["Open","In Progress","Resolved","Closed"],src:["Call","Email","WhatsApp","Chat"],rows:[]},db||{});
let storeOK=true;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){if(!API&&storeOK){storeOK=false;alert("This page cannot save in this browser and no Google Sheet URL is set, so entries will be lost on refresh. Set the API URL in index.html, or open the page from GitHub Pages or your computer.")}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mon=d=>d?new Date(d+"T00:00").toLocaleString("en",{month:"short",year:"numeric"}):"";
const toM=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dur=(s,e)=>{if(!s||!e)return"";let m=toM(e)-toM(s);if(m<0)m+=1440;return fmt(m)};
let tt;const toast=t=>{const x=$("#toast");x.textContent=t;x.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("on"),2600)};
const setSync=t=>$("#sync").textContent=t;
function showLink(){$("#sheetLink").href=db.link||"#"}
$("#sheetLink").onclick=e=>{
  if(db.link)return;
  e.preventDefault();
  const u=prompt("Paste your Google Sheet URL (copy it from the browser address bar). You only need to do this once.");
  if(!u)return;
  if(/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u.trim())){db.link=u.trim();save();showLink();window.open(db.link,"_blank")}
  else toast("That does not look like a Google Sheet URL.");
};
$("#recSheet").onclick=()=>$("#sheetLink").click();

// themes
const THEMES=[["light","Light"],["dark","Dark"],["soft","Neumorphic"],["bw","Black & white"],["paper","Paper"]];
function setTheme(t){document.documentElement.dataset.theme=t;$("#themeSel").value=t;try{localStorage.setItem("hrms_theme",t)}catch(e){}}
$("#themeSel").innerHTML=THEMES.map(x=>`<option value="${x[0]}">${x[1].replace("&","&amp;")}</option>`).join("");
$("#themeSel").onchange=e=>setTheme(e.target.value);
setTheme(THEMES.some(x=>x[0]===document.documentElement.dataset.theme)?document.documentElement.dataset.theme:"light");

// Google Sheet sync
async function push(body){
  if(!API)return true;setSync("Saving...");
  try{const r=await(await fetch(API,{method:"POST",body:JSON.stringify(body)})).json();if(r.error)throw r.error;setSync("Saved to Google Sheet");
    if(body.row){const x=db.rows.find(z=>z.id===body.row.id);if(x){delete x._u;save()}}updBtn();return true}
  catch(e){setSync("Not saved - will retry");updBtn();alert("Could not save to Google Sheet: "+e+"\nYour entry is kept in this browser and will be retried on the next load.");return false}
}
async function pull(){
  if(!API){setSync("Offline mode: data stays in this browser");return}
  setSync("Loading...");
  try{const d=await(await fetch(API+"?action=load")).json();if(d.error)throw d.error;
    const pend=db.rows.filter(r=>r._u);
    if(!db._mp)Object.assign(db,d.masters);
    db.rows=d.rows.filter(x=>!pend.some(p=>p.id===x.id)).concat(pend);
    save();pend.forEach(r=>push({action:"upsertRow",row:r}));if(db._mp)pushMasters();
    if(d.link)db.link=d.link;save();showLink();setSync("Synced with Google Sheet");updBtn();
    fillSelects();renderM();renderRec();renderToday();renderTpl()}
  catch(e){setSync("Could not load: "+e)}
}
const pushMasters=async()=>{db._mp=1;save();const{prod,biz,stat,src,tpl}=db;if(await push({action:"setMasters",masters:{prod,biz,stat,src,tpl}})){delete db._mp;save()}updBtn()};
const unsaved=()=>db.rows.filter(r=>r._u).length+(db._mp?1:0);
function updBtn(){const n=unsaved(),b=$("#syncBtn");b.textContent=n?"Retry save ("+n+" unsaved)":"Sync now";b.classList.toggle("warnb",n>0)}
async function syncNow(){
  if(!API){toast("No Google Sheet URL is set.");return}
  for(const r of db.rows.filter(x=>x._u))await push({action:"upsertRow",row:r});
  if(db._mp)await pushMasters();
  await pull();updBtn();
  toast(unsaved()?"Some items are still unsaved. Check your connection and retry.":"Everything is saved to Google Sheet");
}
$("#syncBtn").onclick=syncNow;

// tabs
$$("#nav button").forEach(b=>b.onclick=()=>{
  $$("#nav button,.tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.t).classList.add("on");
  if(b.dataset.t==="rec"){renderRec();pull()}
});

// entry form
const F={date:"f_date",src:"f_src",prod:"f_prod",s:"f_s",e:"f_e",contact:"f_contact",biz:"f_biz",issue:"f_issue",ticket:"f_ticket",stat:"f_stat",rem:"f_rem"};
function opts(id,list){const el=$(id),v=el.value;el.innerHTML='<option value=""></option>'+list.map(x=>`<option>${esc(x)}</option>`).join("");if(list.includes(v))el.value=v}
function fillSelects(){opts("#f_src",db.src);opts("#f_prod",db.prod);opts("#f_biz",db.biz.map(b=>b.name));opts("#f_stat",db.stat);syncAuto()}
function syncAuto(){
  $("#f_dur").value=dur($("#f_s").value,$("#f_e").value);
  const b=db.biz.find(x=>x.name===$("#f_biz").value);$("#f_code").value=b?b.code:"";
}
["f_s","f_e","f_biz"].forEach(i=>$("#"+i).addEventListener("input",syncAuto));
let editId=null;
function clearForm(){
  editId=null;$("#formTitle").textContent="New entry";$("#saveBtn").textContent="Save entry";$("#clearBtn").textContent="Clear";
  Object.values(F).forEach(i=>$("#"+i).value="");$("#f_date").value=today();syncAuto();
}
$("#clearBtn").onclick=clearForm;
$("#saveBtn").onclick=()=>{
  const r={};for(const k in F)r[k]=$("#"+F[k]).value.trim();
  if(!r.date){toast("Pick a date to save the entry.");return}
  r.code=$("#f_code").value;r.dur=$("#f_dur").value;
  const was=!!editId,row={...r,id:editId||uid(),...(API?{_u:1}:{})};
  if(was)db.rows[db.rows.findIndex(x=>x.id===editId)]=row;
  else db.rows.push(row);
  save();push({action:"upsertRow",row});clearForm();renderToday();toast(was?"Entry updated":"Entry saved");
};
function editRow(id){
  const r=db.rows.find(x=>x.id===id);if(!r)return;
  for(const k in F)$("#"+F[k]).value=r[k]||"";
  editId=id;syncAuto();$("#formTitle").textContent="Edit entry";$("#saveBtn").textContent="Update entry";$("#clearBtn").textContent="Cancel edit";
  $('#nav [data-t="entry"]').click();scrollTo(0,0);
}
function renderToday(){
  const r=db.rows.filter(x=>x.date===today()).reverse();
  $("#t_n").textContent=r.length;$("#t_dur").textContent=fmt(r.reduce((a,x)=>a+(x.dur?toM(x.dur):0),0));
  $("#t_list").innerHTML=r.map(x=>`<li onclick="editRow('${x.id}')" title="Click to edit"><div class="tl"><b class="t rm">${esc(x.rem||"No remarks")}</b><b>${esc(x.dur||"--:--")}</b></div><div class="sub">${x.s?esc(x.s)+" - "+esc(x.e||"..."):"No time"}${x.prod?" · "+esc(x.prod):""}${x.issue?" · "+esc(x.issue):""} ${chip(x.stat)}</div></li>`).join("")||'<li class="muted" style="cursor:default">Nothing logged today yet.</li>';
}

// templates
const TF=["biz","src","prod","issue","stat","contact","rem"];
function renderTpl(){
  const el=$("#tplSel"),v=el.value;
  el.innerHTML='<option value="">'+(db.tpl.length?"Choose a template...":"No templates yet")+'</option>'+db.tpl.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join("");
  el.value=v&&db.tpl[v]?v:"";
}
$("#tplNew").onclick=()=>{$("#tplForm").style.display="";$("#tpl_name").focus()};
$("#tplSave").onclick=()=>{
  const name=$("#tpl_name").value.trim();if(!name){toast("Give the template a name.");return}
  const t={name};TF.forEach(k=>t[k]=$("#"+F[k]).value.trim());
  const i=db.tpl.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  if(i<0)db.tpl.push(t);else db.tpl[i]=t;
  save();pushMasters();renderTpl();$("#tplSel").value=String(i<0?db.tpl.length-1:i);
  $("#tplForm").style.display="none";$("#tpl_name").value="";toast("Template saved");
};
$("#tplApply").onclick=()=>{
  const t=db.tpl[$("#tplSel").value];if(!t){toast("Choose a template first.");return}
  if(editId)clearForm();
  TF.forEach(k=>$("#"+F[k]).value=t[k]||"");
  if(!$("#f_date").value)$("#f_date").value=today();
  syncAuto();toast('"'+t.name+'" applied. Set the times and save.');$("#f_s").focus();
};
$("#tplDel").onclick=()=>{
  const i=$("#tplSel").value;if(i===""||!db.tpl[i]){toast("Choose a template first.");return}
  if(confirm('Delete template "'+db.tpl[i].name+'"?')){db.tpl.splice(i,1);save();pushMasters();renderTpl()}
};

function setTpl(open){const b=$("#tplToggle");$("#tplBody").style.display=open?"":"none";b.textContent=open?"Hide":"Show";b.setAttribute("aria-expanded",open);try{localStorage.setItem("hrms_tpl_open",open?"1":"0")}catch(e){}}
$("#tplToggle").onclick=()=>setTpl($("#tplBody").style.display==="none");
let tplOpen=true;try{tplOpen=localStorage.getItem("hrms_tpl_open")!=="0"}catch(e){}
setTpl(tplOpen);

// records
let rmode="day";
$("#r_day").value=today();$("#r_month").value=today().slice(0,7);
$$("#r_seg button").forEach(b=>b.onclick=()=>{
  rmode=b.dataset.m;$$("#r_seg button").forEach(x=>x.classList.toggle("on",x===b));
  $("#r_day").style.display=rmode==="day"?"":"none";$("#r_month").style.display=rmode==="day"?"none":"";renderRec();
});
$("#r_day").oninput=$("#r_month").oninput=()=>renderRec();
function getRows(){
  const d=rmode==="day",v=d?$("#r_day").value:$("#r_month").value;
  const rows=db.rows.filter(r=>r.date&&(d?r.date===v:r.date.startsWith(v))).sort((a,b)=>a.date.localeCompare(b.date)||(a.s||"").localeCompare(b.s||""));
  rows.forEach((r,i)=>r.sl=i+1);return rows;
}
const H=["SL.no","Month","Date","Code","Source","Product","Transaction Start Time","Transaction End time","Total Duration","CONTACT NO","Business Name","Issue/Request","Ticket No","Status","Remarks"];
const line=r=>[r.sl,mon(r.date),r.date,r.code,r.src,r.prod,r.s,r.e,r.dur,r.contact,r.biz,r.issue,r.ticket,r.stat,r.rem].map(x=>x??"");
const total=rows=>rows.reduce((a,r)=>a+(r.dur?toM(r.dur):0),0);
const chip=s=>s?`<span class="chip ${/resolv|clos|done|complet/i.test(s)?"ok":""}">${esc(s)}</span>`:"";
function renderRec(){
  const rows=getRows();
  $("#r_tot").textContent=`${rows.length} entries · ${fmt(total(rows))}`;
  $("#r_tbl").innerHTML=rows.length?"<tr class=\"hd\">"+H.map(h=>`<th>${h}</th>`).join("")+"<th></th></tr>"+
    rows.map(r=>"<tr>"+line(r).map((x,i)=>`<td data-label="${H[i]}">${i===13?chip(x):esc(x)}</td>`).join("")+
    `<td><button class="btn sm ghost" onclick="editRow('${r.id}')">Edit</button> <button class="btn sm del" onclick="delRow('${r.id}')">Delete</button></td></tr>`).join(""):
    '<tr><td class="muted">No entries for this selection.</td></tr>';
}
function delRow(id){if(confirm("Delete this entry?")){db.rows=db.rows.filter(r=>r.id!==id);save();push({action:"deleteRow",id});renderRec();renderToday();toast("Entry deleted")}}
$("#expBtn").onclick=()=>{
  const rows=getRows();if(!rows.length){toast("No entries to export.");return}
  const t=H.map(()=>"");t[7]="Total";t[8]=fmt(total(rows));
  const ws=XLSX.utils.aoa_to_sheet([H,...rows.map(line),t]),wb=XLSX.utils.book_new();
  ws["!cols"]=[6,10,11,8,10,14,12,12,10,14,22,12,12,12,26].map(wch=>({wch}));
  XLSX.utils.book_append_sheet(wb,ws,"Timesheet");
  const d=rmode==="day";XLSX.writeFile(wb,`Timesheet_${d?"Day":"Month"}_${d?$("#r_day").value:$("#r_month").value}.xlsx`);
};

// masters
const NAMES={biz:"Business names",prod:"Products",stat:"Status",src:"Source"};
let cur="biz",mEdit=null;
function codeFor(name){
  const w=name.trim().split(/\s+/).filter(Boolean);
  const base=(w.length>1?w.slice(0,3).map(x=>x[0]).join(""):name.slice(0,3)).toUpperCase().replace(/[^A-Z0-9]/g,"")||"BIZ";
  let c=base,n=1;while(db.biz.some(b=>b.code===c&&b.name!==mEdit))c=base+(++n);return c;
}
function mReset(){mEdit=null;$("#m_name").value=$("#m_code").value="";$("#m_add").textContent="Add";$("#m_cancel").style.display="none"}
$("#m_cancel").onclick=mReset;
$$("#m_seg button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;$$("#m_seg button").forEach(x=>x.classList.toggle("on",x===b));mReset();renderM()});
const names=()=>db[cur].map(x=>cur==="biz"?x.name:x);
$("#m_add").onclick=()=>{
  const n=$("#m_name").value.trim();if(!n)return;
  if(names().some(x=>x.toLowerCase()===n.toLowerCase()&&x!==mEdit)){toast("That name already exists.");return}
  if(cur==="biz"){
    const code=$("#m_code").value.trim().toUpperCase()||codeFor(n);
    if(mEdit!==null){const b=db.biz.find(x=>x.name===mEdit);b.name=n;b.code=code}else db.biz.push({name:n,code});
  }else if(mEdit!==null)db[cur][db[cur].indexOf(mEdit)]=n;else db[cur].push(n);
  const was=mEdit!==null;save();pushMasters();mReset();renderM();fillSelects();toast(was?"Updated":"Added");
};
function mEditStart(i){
  const it=db[cur][i];mEdit=cur==="biz"?it.name:it;
  $("#m_name").value=mEdit;$("#m_code").value=cur==="biz"?it.code:"";
  $("#m_add").textContent="Update";$("#m_cancel").style.display="";$("#m_name").focus();
}
function mDel(i){
  if(!confirm("Delete this item? Saved entries keep their text."))return;
  db[cur].splice(i,1);save();pushMasters();mReset();renderM();fillSelects();toast("Deleted");
}
function renderM(){
  const L=db[cur],b=cur==="biz";
  $("#m_codew").style.display=b?"":"none";
  $("#m_hint").textContent=b?"Upload columns: Business Name, Code (code is optional and auto-generated if blank).":"Upload a file with one column: Name.";
  $("#m_h").textContent=`${NAMES[cur]} (${L.length})`;
  $("#m_tbl").innerHTML=L.length?`<tr><th>${b?"Business name":"Name"}</th>${b?"<th>Code</th>":""}<th></th></tr>`+
    L.map((it,i)=>`<tr><td>${esc(b?it.name:it)}</td>${b?`<td><span class="chip">${esc(it.code)}</span></td>`:""}<td><button class="btn sm ghost" onclick="mEditStart(${i})">Edit</button> <button class="btn sm del" onclick="mDel(${i})">Delete</button></td></tr>`).join(""):
    '<tr><td class="muted">Nothing here yet. Add an item or upload a file.</td></tr>';
}
$("#m_up").onclick=()=>$("#m_file").click();
$("#m_tpl").onclick=()=>{
  const b=cur==="biz",ws=XLSX.utils.aoa_to_sheet(b?[["Business Name","Code"],["Example Traders","EXT"]]:[["Name"],["Example"]]),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Masters");XLSX.writeFile(wb,cur+"_template.xlsx");
};
$("#m_file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    let add=0,upd=0;
    rows.forEach(r=>{
      const g=n=>{const k=Object.keys(r).find(x=>x.toLowerCase().replace(/[^a-z]/g,"")===n);return k?String(r[k]).trim():""};
      const name=g("businessname")||g("name")||String(Object.values(r)[0]||"").trim();
      if(!name)return;
      if(cur==="biz"){
        const code=g("code").toUpperCase(),b=db.biz.find(x=>x.name.toLowerCase()===name.toLowerCase());
        if(b){if(code&&code!==b.code){b.code=code;upd++}}else{db.biz.push({name,code:code||codeFor(name)});add++}
      }else if(!db[cur].some(x=>x.toLowerCase()===name.toLowerCase())){db[cur].push(name);add++}
    });
    save();pushMasters();renderM();fillSelects();toast(`${add} added, ${upd} updated`);
  }catch(err){toast("Could not read that file.")}
};

let lastDay=today();
function tick(){
  const n=new Date();
  $("#clk_d").textContent=n.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  $("#clk_t").textContent=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  if(today()!==lastDay){lastDay=today();renderToday()}
}
setInterval(tick,1000);tick();
save();clearForm();fillSelects();renderM();renderToday();renderTpl();showLink();updBtn();pull();
</script>
</body>
</html>
