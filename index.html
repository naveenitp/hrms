<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timesheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17231f;--mute:#5d6b66;--line:#d6ddda;--acc:#0f6b5c;--accink:#fff;--warn:#b3341f;--head:#e5ece9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1a2320;--ink:#e6efeb;--mute:#93a39d;--line:#2d3b36;--acc:#4cc2ab;--accink:#07211b;--warn:#ff8a73;--head:#22302c}}
:root[data-theme="dark"]{--bg:#121816;--card:#1a2320;--ink:#e6efeb;--mute:#93a39d;--line:#2d3b36;--acc:#4cc2ab;--accink:#07211b;--warn:#ff8a73;--head:#22302c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 16px 0 0;font-weight:700}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accink)}
main{max-width:1100px;margin:0 auto;padding:20px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
h2{font-size:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label b{color:var(--warn)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
input[readonly]{opacity:.75}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.wide{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--accink);padding:8px 16px;border-radius:6px;font:inherit;cursor:pointer}
.btn.alt{background:none;color:var(--acc)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.del{border-color:var(--warn);color:var(--warn);background:none}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--head)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.muted{color:var(--mute)}
.msg{color:var(--acc);margin-left:8px}
</style>
</head>
<body>
<header>
  <h1>Timesheet</h1>
  <nav>
    <button data-t="entry" class="on">Data entry</button>
    <button data-t="rec">Records &amp; export</button>
    <button data-t="mas">Masters</button>
  </nav>
  <span class="muted" id="sync" style="margin-left:auto"></span>
</header>
<main>

<section class="tab on" id="entry">
  <div class="card">
    <h2 id="formTitle">New entry</h2>
    <p class="muted" id="hint" style="margin-top:-6px"></p>
    <div class="grid">
      <label>Employee <b>*</b><select id="f_emp"></select></label>
      <label>Date <b>*</b><input type="date" id="f_date"></label>
      <label>Month<input id="f_month" readonly></label>
      <label>Source<select id="f_src"></select></label>
      <label>Product<select id="f_prod"></select></label>
      <label>Transaction start time<input type="time" id="f_s"></label>
      <label>Transaction end time<input type="time" id="f_e"></label>
      <label>Total duration (auto)<input id="f_dur" readonly></label>
      <label>Contact no<input id="f_contact" inputmode="tel"></label>
      <label>Business name<select id="f_biz"></select></label>
      <label>Code (auto)<input id="f_code" readonly></label>
      <label>Ticket no<input id="f_ticket"></label>
      <label>Status<select id="f_stat"></select></label>
      <label>Issue / request<select id="f_issue"><option value=""></option><option>Issue</option><option>Request</option></select></label>
      <label class="wide">Remarks<textarea id="f_rem" rows="2"></textarea></label>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="saveBtn">Save entry</button>
      <button class="btn alt" id="clearBtn">Clear</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</section>

<section class="tab" id="rec">
  <div class="card">
    <h2>Filter</h2>
    <div class="row">
      <label>View<select id="r_mode"><option value="day">Day-wise</option><option value="month">Month-wise</option></select></label>
      <label id="r_dayw">Date<input type="date" id="r_day"></label>
      <label id="r_monw" style="display:none">Month<input type="month" id="r_month"></label>
      <button class="btn" id="expBtn">Export to Excel</button>
    </div>
    <p class="muted" style="margin:14px 0 6px">Employees (leave all ticked to include everyone)</p>
    <div class="chips" id="r_emps"></div>
  </div>
  <div class="card">
    <h2>Entries <span class="muted" id="r_tot"></span></h2>
    <div class="scroll"><table id="r_tbl"></table></div>
  </div>
</section>

<section class="tab" id="mas">
  <div class="card">
    <h2>Manage lists</h2>
    <div class="row">
      <label>List<select id="m_list">
        <option value="emp">Employees</option><option value="prod">Products</option>
        <option value="biz">Business names (with code)</option><option value="stat">Status</option><option value="src">Source</option>
      </select></label>
      <label>Name<input id="m_name"></label>
      <label id="m_codew">Code (blank = auto)<input id="m_code" style="width:120px"></label>
      <button class="btn" id="m_add">Add</button>
      <button class="btn alt" id="m_cancel" style="display:none">Cancel</button>
    </div>
    <div class="scroll" style="margin-top:14px"><table id="m_tbl"></table></div>
  </div>
</section>

</main>
<script>
const $=s=>document.querySelector(s), K="hrms_timesheet_v1";
let db=null;
try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{emp:[],prod:[],biz:[],stat:["Open","In Progress","Resolved","Closed"],src:["Call","Email","WhatsApp","Chat"],rows:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const API=""; // paste your Google Apps Script Web app URL between the quotes
const setSync=t=>{const x=$("#sync");if(x)x.textContent=t};
async function push(body){
  if(!API)return;setSync("Saving...");
  try{const r=await(await fetch(API,{method:"POST",body:JSON.stringify(body)})).json();if(r.error)throw r.error;setSync("Saved to Google Sheet")}
  catch(e){setSync("Not saved");alert("Could not save to Google Sheet: "+e)}
}
async function pull(){
  if(!API){setSync("Offline mode: data stays in this browser");return}
  setSync("Loading...");
  try{const d=await(await fetch(API+"?action=load")).json();if(d.error)throw d.error;
    Object.assign(db,d.masters,{rows:d.rows});save();setSync("Synced with Google Sheet");
    fillSelects();empChips();renderM();renderRec()}
  catch(e){setSync("Could not load: "+e)}
}
const pushMasters=()=>{const{emp,prod,biz,stat,src}=db;return push({action:"setMasters",masters:{emp,prod,biz,stat,src}})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mon=d=>d?new Date(d+"T00:00").toLocaleString("en",{month:"short",year:"numeric"}):"";
const toM=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dur=(s,e)=>{if(!s||!e)return"";let m=toM(e)-toM(s);if(m<0)m+=1440;return fmt(m)};
const names={emp:"Employees",prod:"Products",biz:"Businesses",stat:"Status",src:"Source"};

// tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");$("#"+b.dataset.t).classList.add("on");
  if(b.dataset.t==="rec"){renderRec();pull()}
});

// selects
function opts(id,list,blank=true){const el=$(id),v=el.value;
  el.innerHTML=(blank?'<option value=""></option>':"")+list.map(x=>`<option>${esc(x)}</option>`).join("");
  if(list.includes(v))el.value=v}
function fillSelects(){
  opts("#f_emp",db.emp,false);opts("#f_src",db.src);opts("#f_prod",db.prod);
  opts("#f_biz",db.biz.map(b=>b.name));opts("#f_stat",db.stat);
  $("#hint").textContent=db.emp.length?"":"Add employees in Masters first.";
  syncAuto();
}
function syncAuto(){
  $("#f_month").value=mon($("#f_date").value);
  $("#f_dur").value=dur($("#f_s").value,$("#f_e").value);
  const b=db.biz.find(x=>x.name===$("#f_biz").value);$("#f_code").value=b?b.code:"";
}
["f_date","f_s","f_e","f_biz"].forEach(i=>$("#"+i).addEventListener("input",syncAuto));

// entry
let editId=null;
const F={emp:"f_emp",date:"f_date",src:"f_src",prod:"f_prod",s:"f_s",e:"f_e",contact:"f_contact",biz:"f_biz",issue:"f_issue",ticket:"f_ticket",stat:"f_stat",rem:"f_rem"};
function clearForm(){
  editId=null;$("#formTitle").textContent="New entry";$("#saveBtn").textContent="Save entry";
  const emp=$("#f_emp").value;
  Object.values(F).forEach(i=>$("#"+i).value="");
  $("#f_emp").value=emp;$("#f_date").value=today();syncAuto();
}
$("#clearBtn").onclick=clearForm;
$("#saveBtn").onclick=()=>{
  const r={};for(const k in F)r[k]=$("#"+F[k]).value.trim();
  if(!r.emp||!r.date){flash("Choose an employee and date.");return}
  r.code=$("#f_code").value;r.dur=$("#f_dur").value;
  const was=!!editId,row={...r,id:editId||uid()};
  if(was)db.rows[db.rows.findIndex(x=>x.id===editId)]=row;
  else db.rows.push(row);
  save();push({action:"upsertRow",row});clearForm();flash(was?"Entry updated.":"Entry saved.");
};
function flash(t){$("#msg").textContent=t;setTimeout(()=>$("#msg").textContent="",3000)}
function editRow(id){
  const r=db.rows.find(x=>x.id===id);if(!r)return;
  for(const k in F)$("#"+F[k]).value=r[k]||"";
  editId=id;syncAuto();$("#formTitle").textContent="Edit entry";$("#saveBtn").textContent="Update entry";
  document.querySelector('nav [data-t="entry"]').click();scrollTo(0,0);
}

// records
$("#r_day").value=today();$("#r_month").value=today().slice(0,7);
$("#r_mode").onchange=()=>{const d=$("#r_mode").value==="day";$("#r_dayw").style.display=d?"":"none";$("#r_monw").style.display=d?"none":"";renderRec()};
$("#r_day").oninput=$("#r_month").oninput=()=>renderRec();
function empChips(){
  const had=[...document.querySelectorAll("#r_emps input")].reduce((o,i)=>(o[i.value]=i.checked,o),{});
  $("#r_emps").innerHTML=db.emp.map(e=>`<label><input type="checkbox" value="${esc(e)}" ${had[e]===false?"":"checked"}>${esc(e)}</label>`).join("")||'<span class="muted">No employees yet.</span>';
  document.querySelectorAll("#r_emps input").forEach(i=>i.onchange=renderRec);
}
function getRows(){
  const sel=[...document.querySelectorAll("#r_emps input:checked")].map(i=>i.value);
  const d=$("#r_mode").value==="day",v=d?$("#r_day").value:$("#r_month").value;
  const rows=db.rows.filter(r=>sel.includes(r.emp)&&(d?r.date===v:r.date.startsWith(v)))
    .sort((a,b)=>a.emp.localeCompare(b.emp)||a.date.localeCompare(b.date)||(a.s||"").localeCompare(b.s||""));
  const c={};rows.forEach(r=>{c[r.emp]=(c[r.emp]||0)+1;r.sl=c[r.emp]});
  return rows;
}
const H=["SL.no","Employee","Month","Date","Code","Source","Product","Transaction Start Time","Transaction End time","Total Duration","CONTACT NO","Business Name","Issue/Request","Ticket No","Status","Remarks"];
const line=r=>[r.sl,r.emp,mon(r.date),r.date,r.code,r.src,r.prod,r.s,r.e,r.dur,r.contact,r.biz,r.issue,r.ticket,r.stat,r.rem].map(x=>x??"");
const sum=rows=>{const m={};rows.forEach(r=>{const o=m[r.emp]=m[r.emp]||{n:0,t:0};o.n++;if(r.dur)o.t+=toM(r.dur)});return m};
function renderRec(){
  if(!document.querySelector("#r_emps input")&&db.emp.length)empChips();
  const rows=getRows(),t=Object.values(sum(rows)).reduce((a,o)=>a+o.t,0);
  $("#r_tot").textContent=`${rows.length} entries, ${fmt(t)} total`;
  $("#r_tbl").innerHTML=rows.length?"<tr>"+H.map(h=>`<th>${h}</th>`).join("")+"<th></th></tr>"+
    rows.map(r=>"<tr>"+line(r).map(x=>`<td>${esc(x)}</td>`).join("")+
    `<td><button class="btn sm alt" onclick="editRow('${r.id}')">Edit</button> <button class="btn sm del" onclick="delRow('${r.id}')">Delete</button></td></tr>`).join(""):
    '<tr><td class="muted">No entries for this selection.</td></tr>';
}
function delRow(id){if(confirm("Delete this entry?")){db.rows=db.rows.filter(r=>r.id!==id);save();push({action:"deleteRow",id});renderRec()}}
$("#expBtn").onclick=()=>{
  const rows=getRows();if(!rows.length){alert("No entries to export.");return}
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([H,...rows.map(line)]);
  ws["!cols"]=H.map((h,i)=>({wch:[6,16,10,11,8,10,14,12,12,10,14,22,34,12,12,26][i]}));
  XLSX.utils.book_append_sheet(wb,ws,"Timesheet");
  const s=sum(rows),ss=XLSX.utils.aoa_to_sheet([["Employee","Entries","Total Duration"],...Object.entries(s).map(([e,o])=>[e,o.n,fmt(o.t)])]);
  XLSX.utils.book_append_sheet(wb,ss,"Summary");
  const d=$("#r_mode").value==="day";
  XLSX.writeFile(wb,`Timesheet_${d?"Day":"Month"}_${d?$("#r_day").value:$("#r_month").value}.xlsx`);
};

// masters
let mEdit=null;
const mk=()=>$("#m_list").value;
function codeFor(name){
  const w=name.trim().split(/\s+/).filter(Boolean);
  let base=(w.length>1?w.slice(0,3).map(x=>x[0]).join(""):name.slice(0,3)).toUpperCase().replace(/[^A-Z0-9]/g,"")||"BIZ";
  let c=base,n=1;while(db.biz.some(b=>b.code===c&&b.name!==mEdit))c=base+(++n);return c;
}
function mReset(){mEdit=null;$("#m_name").value=$("#m_code").value="";$("#m_add").textContent="Add";$("#m_cancel").style.display="none"}
$("#m_cancel").onclick=mReset;
$("#m_list").onchange=()=>{mReset();$("#m_codew").style.display=mk()==="biz"?"":"none";renderM()};
$("#m_add").onclick=()=>{
  const k=mk(),n=$("#m_name").value.trim();if(!n)return;
  const dup=k==="biz"?db.biz.some(b=>b.name.toLowerCase()===n.toLowerCase()&&b.name!==mEdit):db[k].some(x=>x.toLowerCase()===n.toLowerCase()&&x!==mEdit);
  if(dup){alert("That name already exists.");return}
  if(k==="biz"){
    const code=($("#m_code").value.trim().toUpperCase())||codeFor(n);
    if(mEdit!==null){const b=db.biz.find(x=>x.name===mEdit);b.name=n;b.code=code}else db.biz.push({name:n,code});
  }else{
    if(mEdit!==null)db[k][db[k].indexOf(mEdit)]=n;else db[k].push(n);
  }
  save();pushMasters();mReset();renderM();fillSelects();empChips();
};
function mEditStart(i){
  const k=mk(),it=db[k][i];mEdit=k==="biz"?it.name:it;
  $("#m_name").value=k==="biz"?it.name:it;$("#m_code").value=k==="biz"?it.code:"";
  $("#m_add").textContent="Update";$("#m_cancel").style.display="";$("#m_name").focus();
}
function mDel(i){
  if(!confirm("Delete this item? Existing entries keep their saved text."))return;
  db[mk()].splice(i,1);save();pushMasters();mReset();renderM();fillSelects();empChips();
}
function renderM(){
  const k=mk(),L=db[k];
  $("#m_tbl").innerHTML=L.length?"<tr><th>"+names[k]+"</th>"+(k==="biz"?"<th>Code</th>":"")+"<th></th></tr>"+
    L.map((it,i)=>`<tr><td>${esc(k==="biz"?it.name:it)}</td>${k==="biz"?`<td>${esc(it.code)}</td>`:""}<td><button class="btn sm alt" onclick="mEditStart(${i})">Edit</button> <button class="btn sm del" onclick="mDel(${i})">Delete</button></td></tr>`).join(""):
    '<tr><td class="muted">Nothing here yet. Add the first item above.</td></tr>';
}

$("#m_codew").style.display="none";
fillSelects();$("#f_date").value=today();syncAuto();renderM();empChips();pull();
</script>
</body>
</html>
